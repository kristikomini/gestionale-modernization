spring:
  application:
    name: modern-gestionale
  datasource:
    url: jdbc:postgresql://localhost:5432/gestionale
    username: app
    password: app
  jpa:
    hibernate:
      # Schema is owned by Flyway — Hibernate only validates entities against it (standards rule 1).
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true   # exposes query counts (the N+1 story) in logs
    open-in-view: false             # no lazy loading in the view layer; fetch explicitly
  flyway:
    enabled: true

# Anti-Corruption Layer target + resilience policy for the legacy SOAP backend.
legacy:
  policy-service:
    wsdl-url: http://localhost:8088/ws/policy?wsdl

resilience4j:
  circuitbreaker:
    instances:
      legacyPolicyClient:
        sliding-window-size: 10
        failure-rate-threshold: 50        # open after 50% of the last 10 calls fail
        wait-duration-in-open-state: 10s
  retry:
    instances:
      legacyPolicyClient:
        max-attempts: 3
        wait-duration: 200ms
  timelimiter:
    instances:
      legacyPolicyClient:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
