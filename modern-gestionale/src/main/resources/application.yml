# Strangler route table: per resource, is the route migrated to the modern DB yet?
# true  -> served from the modern database (this app owns the data)
# false -> served from the legacy system via the ACL (requires legacy.policy-service.enabled=true)
strangler:
  policies:
    migrated: true

spring:
  application:
    name: modern-gestionale
  datasource:
    url: jdbc:postgresql://localhost:5432/gestionale
    username: app
    password: app
  jpa:
    hibernate:
      # Schema is owned by Flyway — Hibernate only validates entities against it (standards rule 1).
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true   # exposes query counts (the N+1 story) in logs
    open-in-view: false             # no lazy loading in the view layer; fetch explicitly
  flyway:
    enabled: true

# Anti-Corruption Layer target + resilience policy for the legacy SOAP backend.
# Disabled by default: the modern app serves migrated routes from its own DB. Set enabled=true
# (and a reachable endpoint-url) to activate the strangler path that proxies to legacy.
legacy:
  policy-service:
    enabled: false
    endpoint-url: http://localhost:8088/ws/policy

resilience4j:
  circuitbreaker:
    instances:
      legacyPolicyClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50        # open after 50% of the last (>=5) calls fail
        wait-duration-in-open-state: 10s
  retry:
    instances:
      legacyPolicyClient:
        max-attempts: 3
        wait-duration: 200ms
        # A tripped breaker means stop hammering — do not retry the fail-fast signal.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  timelimiter:
    instances:
      legacyPolicyClient:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
